; PuP Pack (Tron Legacy "End of Line" PuP-Pack by Terry Red, pup_pack/ submodule) on three screens.
; Read by Godot (game/pup/pup_player.gd) and by MPF (game/tron_pup/settings.py).
;
; Do not edit this file for your cabinet: put the keys you change in game/pup.local.cfg (git-ignored,
; same sections), it is read after this one. TRON_PUP=0 in the environment turns the whole PuP off.
; Values are JSON: true/false, numbers, "strings", [lists].

[pup]
; hide_cursor: "auto" (default) hides the mouse pointer when the backglass is fullscreen; true/false force it
; (a Pi 4 cabinet with no pointer; a windowed desktop test keeps it).

; false: no PuP windows, no PuP videos, the ROM music plays as before
enabled=true
; hide the mouse pointer while the game runs (a cabinet has none to show)
hide_cursor=true
; split layout: width of the DMD and topper column, as a multiple of the space the full-height backglass leaves (1920x1080: 480 x 2
; = 960 wide, the backglass 960x720). 1 = the backglass as large as the monitor's height allows
column_scale=2.0
; split layout, backglass + DMD + topper: share of the monitor's width of the left column (backglass over DMD); the topper
; takes the right column at full height (0.5: 1920x1080 = backglass 960x840, DMD 960x240 under it, topper 960x1080)
split_left=0.5
; the optional third screen (topper videos, PuP screens 13 and 14); false = no window, no topper videos
third_screen=true
; PuP OST music (PuP screen 15) instead of the ROM music. false keeps the ROM music, still plays the videos
ost_music=true
; the PuP Pack folder (relative to the repository root) and the converted media (scripts/pup/gen_pup.py)
pack_dir="pup_pack/trn_174h"
media_dir="pup_media/trn_174h"
; seconds between two "TRON logo in attract" (D1) triggers while attract runs; trigger 5 itself rests 240 s
attract_cycle_seconds=60.0
; volumes in percent, applied on top of the PuP Pack's own playlist/trigger volumes
video_volume=100
music_volume=100
; "split" (default): the backglass at the left, as large as the monitor's height allows, the DMD over the topper in the
; column at the right; all borderless; position and size are ignored (a fullscreen backglass or a narrow monitor falls
; back to "stack"). "stack": backglass, DMD, topper one under the other at the left of the backglass's monitor, as large as
; its height allows (each keeps the shape of its size below; position is ignored). "manual": every window
; at its own screen/position/size below (a cabinet: set this in pup.local.cfg)
layout="split"

; Every window: screen = monitor index (0 = primary), position/size in pixels on that monitor,
; fullscreen = cover the whole monitor (position/size ignored), borderless = no title bar.
; Every window can be resized; its content follows. run.py --dmd-size WxH sets the DMD window's size.

; Screen 1: the backglass (4:3). PuP screens 2 (underlay: background and mode loops) and 12 (top layer: event
; videos). The videos are 16:9: fit = whole video with black bars, fill = cover the screen (crops the sides),
; stretch = distort to the screen.
[backglass]

; false: no backglass window (a DMD-only screen); its videos are not played
enabled=true
screen=0
position=[0, 0]
size=[800, 600]
fullscreen=false
borderless=false
fit="fit"
; vertical alignment of a fitted 16:9 video on a 4:3 screen: 0 = top, 0.5 = centre, 1 = bottom
align=0.5
; the service menu on the backglass too (the DMD keeps the ROM's screens): menus, audits and adjustments a page at
; a time, the switch, lamp and coil tests with the device on the playfield and in its matrix. It fades in over the
; backglass art (scripts/pup/gen_pup.py makes the still); false = the DMD alone
service_menu=true

; Screen 2: the large LCD DMD, with the game's own 128x32 DMD in its middle.
; background="lightcycles": the DMD in a neon frame over a live 3D chase of two light cycles (their trails fade,
; they derez when they hit one); lightcycles_dmd = the DMD's width as a share of the window's, at most
; lightcycles_dmd_height of its height (0.68 and 0.62: the DMD's share of the pack's own DMD panel art). background="frame": the DMD in the PuP Pack's DMD panel art (the bottom of its 4:3 backbox art);
; frame_crop = [x, y, w, h] in pixels of frame_image; dmd_rect = [x, y, w, h] of the DMD in the same pixels
; (fitted inside, 4:1); frame_image="" draws no frame: the DMD then fills dmd_rect of a black window.
[dmd]

; window: "window" = its own window; "external" = none on screen (the DMD goes to a real display fed by the game, a
; PIN2DMD or a ZeDMD); "stacked" = in the backglass window, in a band under its screens (videos fitted above it);
; "overlay" = in the backglass window, over the bottom of its screens; "auto" = "external" when the bundle's launcher
; found a PIN2DMD or ZeDMD that answers, else "overlay" (the Raspberry Pi 4 profile's choice). band = the DMD band's share of the backglass
; window's height (0.25: a 16:9 screen keeps 16:9 videos above a 4:1 DMD). [dmd] rect and [backglass] rect = [x, y,
; w, h] (pixels of the backglass's render_size when it has one) place them by hand. With "external", "stacked" or
; "overlay" a full screen backglass is the only window and the X server page-flips it (Raspberry Pi 4: 29.6
; instead of 21 FPS with a 30 FPS cap). The service menu stays in the screens' area. corner_radius: with "stacked" or
; "overlay", the DMD's area becomes a black panel with corners that round (same pixels as rect), 0 = square;
; corner_clip=true also clips the DMD to them (slow on a Raspberry Pi 4: keep view_size inside the round area).
; filter: "linear" or "nearest" scaling of the DMD picture (default linear in HD, nearest otherwise); view_size =
; [w, h]: the DMD exactly that big in its area (rect's pixels), for a whole number of pixels per dot.
window="window"
band=0.25
corner_radius=0
corner_clip=false
screen=0
position=[0, 620]
size=[960, 238]
fullscreen=false
borderless=false
background="lightcycles"
lightcycles_dmd=0.68
lightcycles_dmd_height=0.62
; background="lightcycles" only: "cycles" = the smaller DMD above with the light cycles round it; "full" = the
; DMD full size over the grid, no light cycles: as large as the window takes with its neon frame, at most
; full_dmd_mm wide (320: a real DMD's 320x80 mm; 0 = no limit) when screen_mm is given. The service menu's
; ADJUSTMENTS > DISPLAY ADJUSTMENTS > PUP DMD SIZE chooses too, over this value
dmd_size="cycles"
full_dmd_mm=320
; the DMD monitor's picture in mm, [width, height]: keeps the DMD 4:1 on the glass when its pixels are not
; square, and sizes full_dmd_mm. [0, 0] = not known (square pixels, no mm limit). A 1280x390 bar of 360x109 mm:
; screen_mm=[360, 109] in pup.local.cfg (docs/pup/README.md, "DMD size")
screen_mm=[0, 0]
frame_image="PuPAlphas/Tron Backbox 4x3 or 5x4.png"
frame_crop=[0, 1060, 1920, 476]
dmd_rect=[300, 1172, 1320, 292]
; round dots like a real DMD (false: square pixels); classic DMD only, HD has its own (run.py --dmd-dots)
dots=true
; minimise the game's own 128x32 window (it stays the source of the DMD picture)
hide_main_window=true

; Screen 3 (optional, [pup] third_screen): the topper, PuP screens 13 (underlay) and 14 (top layer).
[topper]

screen=0
position=[820, 0]
size=[960, 281]
fullscreen=false
borderless=false
fit="fit"
align=0.0

; Remote PuP screens: a small display on the network, such as the remote topper on a Raspberry Pi
; (docs/pup/remote_topper.md, platforms/pup-remote-topper.md in the platform), gets the PuP commands of its screens from the game (the platform's pup_remote server).
; Turn it on on the cabinet in pup.local.cfg; the display finds the game by itself on the local network.
[remote]

enabled=false
; TCP port of the commands, and UDP port of the display's broadcast that finds the game
port=5052
; the address the game listens on: "0.0.0.0" = every network the computer is on
listen="0.0.0.0"
; answer the displays' broadcast (false: each display needs the game's address, host= in its own config)
discovery=true
