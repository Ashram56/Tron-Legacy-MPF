#config_version=6

# A ZeDMD (RGB LED DMD on USB serial or Wi-Fi, https://github.com/PPUC/ZeDMD) as an extra DMD output. Given after the
# hardware overlay:   mpf game . -c config,hw_virtual,zedmd   (or: python scripts/run.py --zedmd)
# The game's own platform (game/tron/zedmd_native.py: pyserial, the ZeDMD serial protocol; MPF's libzedmd one does
# not load on every Python and picks the x64 library on a Pi) takes the 128x32 RGB frames that Godot sends as
# "rgb_dmd_frame" (game/tools/pin2dmd.gd, started with "-- --zedmd"). docs/hardware.md, "ZeDMD".
# The frames are monochrome: the 16 shades of the DMD art through one colour. Colour is only ever the frame's own
# content, so a ZeDMD with no colourisation shows the DMD as the original did.

mpf:
  platforms:
    zedmd_native: tron.zedmd_native.ZedmdNativePlatform

hardware:
  rgb_dmd: zedmd_native

zedmd:
  width: 128
  height: 32               # (ZEDMD_PORT in the environment names the serial port; else the first ZeDMD found)

rgb_dmds:
  default:
    source_display: dmd

# With the P-ROC (hw_proc) the ZeDMD replaces the original DMD: the P-ROC's dmds: dmd goes to the virtual platform.
dmds:
  dmd:
    platform: virtual
