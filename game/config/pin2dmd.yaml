#config_version=6

# A PIN2DMD (RGB LED DMD on USB) as an extra DMD output. Given after the hardware overlay:
#   mpf game . -c config,hw_virtual,pin2dmd   (or: python scripts/run.py --pin2dmd)
# MPF's own pin2dmd platform (pyusb, USB 0314:e457) takes the 128x32 RGB frames that Godot sends as "rgb_dmd_frame"
# (game/tools/pin2dmd.gd, started with "-- --pin2dmd"). docs/hardware.md, "PIN2DMD".

hardware:
  rgb_dmd: pin2dmd

pin2dmd:
  resolution: 128x32
  panel: rgb              # rbg for panels whose green and blue wires are swapped

rgb_dmds:
  default:                # the PIN2DMD platform only accepts this name
    source_display: dmd

# With the P-ROC (hw_proc) the PIN2DMD replaces the original DMD: the P-ROC's dmds: dmd goes to the virtual
# platform, so nothing is sent to the DMD connector (run.py then also leaves out --proc-dmd).
dmds:
  dmd:
    platform: virtual
