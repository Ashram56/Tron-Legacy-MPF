; Scorbit (scorbit.io): live scores, player claims and leaderboards in the Scorbit app. Read by MPF
; (game/tron/scorbit.py); docs/scorbit.md says how to set it up.
;
; Do not put your credentials here: this file is in the public repository. Copy the [scorbit] section to
; game/scorbit.local.cfg (git-ignored), read after this one, and fill it in there. The values are plain text.
; TRON_SCORBIT=0 in the environment turns Scorbit off for one run.

[scorbit]

; the provider name, machine id and encrypted provider key Scorbit gives a game maker (support@scorbit.io).
; Without all three the service menu's SCORBIT STATUS says NOT CONFIGURED and nothing is sent
provider=
machine_id=
encrypted_key=
; "production" or "staging" (Scorbit's test server); the service menu's SCORBIT SERVER chooses between
; the two at run time, this is its factory value
hostname=production
; optional: this cabinet's serial number (a whole number) and device UUID; the SDK makes the UUID from the
; network card's MAC address when it is empty
serial_number=
uuid=
; where the SDK keeps this cabinet's device key once it has one (relative to game/; git-ignored data/)
key_file=data/scorbit_device_key.txt
